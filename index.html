<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet muscu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: carnet d'entraînement une colonne (max 640px), en-tête collant, barre d'onglets en bas, minuteur de repos au-dessus */
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#E7EBEF; --line:#D3D9DF;
  --ink:#15202A; --muted:#5A6977;
  --accent:#C9531A; --accent-soft:#FBE6DA; --on-accent:#FFFFFF;
  --court:#1F4C78; --court-soft:#E0E9F3;
  --good:#1D7F48; --good-soft:#DFF1E6; --warn:#9C6410; --warn-soft:#F8EDD6; --bad:#B9372D; --bad-soft:#F7E0DD;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; --tabs-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --surface:#151D25; --surface-2:#1D2731; --line:#2A3743;
  --ink:#E6EBF0; --muted:#94A2AF;
  --accent:#F07A3B; --accent-soft:#3A2418; --on-accent:#1B0D05;
  --court:#86B6E6; --court-soft:#18293A;
  --good:#52C383; --good-soft:#132D1D; --warn:#E3AA45; --warn-soft:#33270F; --bad:#F06B60; --bad-soft:#3A1C19;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1318; --surface:#151D25; --surface-2:#1D2731; --line:#2A3743;
  --ink:#E6EBF0; --muted:#94A2AF;
  --accent:#F07A3B; --accent-soft:#3A2418; --on-accent:#1B0D05;
  --court:#86B6E6; --court-soft:#18293A;
  --good:#52C383; --good-soft:#132D1D; --warn:#E3AA45; --warn-soft:#33270F; --bad:#F06B60; --bad-soft:#3A1C19;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.brand b{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.court{background:var(--court-soft);color:var(--court)}

main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(var(--tabs-h) + 96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border:none;padding:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.big{font-size:18px;padding:14px 18px;width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:none;color:var(--court);font-weight:600;padding:6px 0;min-height:36px}

.hero-date{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.goal{border-left:4px solid var(--court);background:var(--court-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.goal .t{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--court)}
.alert{border-radius:var(--r);padding:12px 14px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.good{background:var(--good-soft);color:var(--good)}
.alert.info{background:var(--court-soft);color:var(--court)}

.plan{border:2px solid var(--accent)}
.plan .name{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;background:var(--surface-2);font-size:12px;min-width:0}
.day .d{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .s{font-family:var(--f-display);font-weight:700;font-size:13px;text-align:center;line-height:1.1;overflow-wrap:anywhere;max-width:100%}
.day.today{outline:2px solid var(--accent)}
.day.done{background:var(--good-soft);color:var(--good)}
.day.done .d{color:var(--good)}
.day .k{font-size:11px;color:var(--muted);text-align:center}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:38px;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:17px;padding:0 10px}
.chip.txt{font-family:var(--f-body);font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on.hi{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.sec.on{background:var(--court);border-color:var(--court);color:var(--bg)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg .chip{white-space:nowrap;font-family:var(--f-body);font-size:15px}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:none}
.toggle input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,input.plain,select{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;min-height:44px;max-width:100%;width:100%}
.f input.n{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

/* Séance */
.sess-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:10;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.clock{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--warn)} .clock.bad{color:var(--bad)}
.group{border:1px dashed var(--court);border-radius:calc(var(--r) + 4px);padding:10px;display:flex;flex-direction:column;gap:10px}
.group > .gh{color:var(--court);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 4px}
.ex .exname{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.presc{font-size:14px;color:var(--muted)}
.target{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.target .tl{flex:none}
.target p{font-size:14px;min-width:0}
.last{font-size:14px;color:var(--muted)}
.last b{color:var(--ink);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.setrow.plyo{grid-template-columns:26px minmax(0,1fr) 48px}
.sn{font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:center;font-size:18px}
.fld{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-height:46px;min-width:0}
.fld input{border:none;background:transparent;width:100%;min-width:0;font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;padding:6px 0;outline:none}
.fld span{font-size:13px;color:var(--muted);flex:none}
.fld:focus-within{border-color:var(--accent)}
.plyo-lab{font-family:var(--f-display);font-size:20px;font-weight:600}
.chk{width:48px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;color:var(--muted)}
.setrow.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.setrow.done .fld{background:var(--good-soft);border-color:transparent}
.ex.skipped{opacity:.75}
.ex.complete{border-color:var(--good)}
details.cue summary{cursor:pointer;color:var(--court);font-weight:600;font-size:14px;list-style:none}
details.cue summary::-webkit-details-marker{display:none}
details.cue p{font-size:14px;margin-top:6px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;resize:vertical}

/* Progrès */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.num{white-space:nowrap}
.scroll{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.stat .l{font-size:12px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:88px minmax(0,1fr) 74px;gap:8px;align-items:center;font-size:14px}
.mbar{position:relative;height:12px;background:var(--surface-2);border-radius:999px}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:999px}
.mbar b{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:var(--court);border-radius:2px}
.mrow .v{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* Listes et éditeurs */
.hitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:0}
.hitem .n{font-family:var(--f-display);font-size:20px;font-weight:700}
.hdetail{display:flex;flex-direction:column;gap:6px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.item .t{font-weight:700}
.item .fields{grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}
.item .f input,.item .f select{min-height:40px;padding:6px 8px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:52px}
.pick .n{font-weight:700}
.pick .m{font-size:13px;color:var(--muted)}

/* Barres fixes */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:none;min-height:var(--tabs-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:29;padding:0 16px 10px}
.restbar-in{max-width:608px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.restbar .rt{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:72px}
.restbar .rl{flex:1;font-size:14px;min-width:0}
.restbar button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:10px;padding:6px 10px;font-weight:600;min-height:40px}
.restbar.end .restbar-in{background:var(--good);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + 84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.sci h3{font-size:18px}
.sci p{font-size:15px}
.sci .src{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand">Carnet <b>muscu</b></div>
  <span id="mode" class="pill">Connexion…</span>
</div></header>

<main id="app"><p class="empty">Chargement du carnet…</p></main>

<div id="restbar" class="restbar" hidden><div class="restbar-in">
  <span class="rt" id="rest-time">0:00</span>
  <span class="rl" id="rest-label">Repos</span>
  <button type="button" data-act="rest-add">+15 s</button>
  <button type="button" data-act="rest-stop">Passer</button>
</div></div>

<div id="toast" class="toast" hidden></div>

<nav class="tabs" aria-label="Navigation"><div class="tabs-in" id="tabs"></div></nav>

<script>
(function(){
'use strict';

/* ================= Utilitaires ================= */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseIso = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const today = () => iso(new Date());
const mondayOf = s => { const d = parseIso(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 86400000);
const num = v => { if (v == null) return null; const s = String(v).trim().replace(',', '.'); if (s === '') return null; const n = Number(s); return isFinite(n) ? n : null; };
const fmtKg = x => (x == null || isNaN(x)) ? '—' : String(Math.round(x * 100) / 100).replace('.', ',');
const roundTo = (x, step) => { step = step > 0 ? step : 0.25; return Math.round(Math.round(x / step) * step * 100) / 100; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const WEEKDAYS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const fmtDate = s => { const d = parseIso(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const fmtDateLong = s => { const d = parseIso(s); return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const e1rm = (kg, reps) => kg * (1 + reps / 30);
const clone = o => JSON.parse(JSON.stringify(o));
const rid = () => Math.random().toString(36).slice(2, 8);
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

/* ================= Bibliothèque et programme par défaut ================= */
const MUSCLES = ['Pectoraux','Dos','Épaules','Biceps','Triceps','Quadriceps','Ischios','Fessiers','Mollets','Abdos'];
const KINDS = { load:'Charge', bw:'Poids du corps + lest', plyo:'Pliométrie', check:'À cocher' };
const CATS = { lower:'Polyarticulaire bas du corps', upper:'Polyarticulaire haut du corps', iso:'Isolation (petit muscle)' };
const M = (p, s) => ({ p: p || [], s: s || [] });
const BASE_EX = {
  ua_bench:{name:'Développé couché haltères ou machine', kind:'load', cat:'upper', step:2, sets:3, lo:6, hi:8, rest:150, muscles:M(['Pectoraux'],['Triceps','Épaules']), cue:'Omoplates serrées, descente contrôlée. Avec des haltères, note le poids d’un haltère.'},
  ua_pull:{name:'Tractions pronation', kind:'bw', cat:'upper', step:1.25, sets:4, lo:5, hi:7, rest:150, muscles:M(['Dos'],['Biceps']), cue:'Arrête-toi 1-2 reps avant l’échec. Le poids noté est le lest (0 = poids du corps).'},
  ua_lat:{name:'Élévations latérales', kind:'load', cat:'iso', step:1, sets:3, lo:12, hi:15, rest:75, muscles:M(['Épaules']), cue:'Monte jusqu’à l’horizontale, sans élan. Note le poids d’un haltère.'},
  ua_rear:{name:'Reverse fly (arrière d’épaule)', kind:'load', cat:'iso', step:1, sets:3, lo:12, hi:15, rest:75, muscles:M(['Épaules']), cue:'Bras presque tendus, tire vers l’arrière sans hausser les épaules.'},
  ua_skull:{name:'Barre au front', kind:'load', cat:'iso', step:2, sets:3, lo:8, hi:12, rest:75, muscles:M(['Triceps']), cue:'Si les coudes gênent, remplace par l’extension à la poulie au-dessus de la tête.'},
  ua_curl:{name:'Curl incliné', kind:'load', cat:'iso', step:1, sets:3, lo:10, hi:12, rest:75, muscles:M(['Biceps']), cue:'Bras derrière le buste, pas de balancier.'},
  ua_abs:{name:'Abdos à la poulie', kind:'load', cat:'iso', step:2.5, sets:3, lo:8, hi:12, rest:60, muscles:M(['Abdos']), cue:'Enroule le buste, bassin fixe.'},
  la_warm:{name:'Échauffement jambes', kind:'check', cue:'5 min de vélo, 2×10 pas latéraux avec élastique, 2×10 mobilité de cheville au mur (genou vers l’avant, talon au sol), 2×10 squats lents.'},

/* ================= Test de détente, bilan de bloc, fatigue ================= */
const JUMP_PROTOCOL = 'Après l’échauffement, avant les sauts et la musculation. 3 sauts avec contre-mouvement au maximum, 1 min de repos entre chaque, toujours avec la même méthode (mains sur les hanches, mesure par vidéo ou marque à la craie au mur). L’appli garde le meilleur.';
function testsList(){ const t = []; S.docs.forEach((o, id) => { if (id.indexOf('t_') === 0) t.push(Object.assign({ id }, o)); }); return t.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }

function testForBlock(block){ if (block < 1) return null; const r = blockRange(block); return testsList().filter(t => t.date >= r.from && t.date <= r.to).pop() || null; }

function totFor(exId, kg){ const e = exDef(exId); return e && e.kind === 'bw' ? (bodyweight() || 0) + kg : kg; }

function fatigueCheck(){
  const d = today(); const wk = weekInfo(d);

  const recent = workouts().filter(w => w.status === 'terminée' && !w.deload && w.date >= addDays(d, -8));
  const drops = []; let compared = 0;
  recent.forEach(w => {
    Object.keys(w.ex || {}).forEach(k => {
      const kind = kindOf(k, w); if (kind !== 'load' && kind !== 'bw') return;
      const h = history(k, null).filter(x => !x.deload);
      const i = h.findIndex(x => x.date === w.date && x.at === (w.startedAt || 0));
      if (i < 0 || !h[i + 1]) return;
      compared++;
      const cur = bestE1(canon(k), h[i]), prev = bestE1(canon(k), h[i + 1]);
      if (cur < prev * 0.975) { const e = exDef(k); drops.push((e ? e.name : k) + ' (−' + Math.max(3, Math.round((1 - cur / prev) * 100)) + ' %)'); }
    });

    return { drops, compared, avgSleep: sl.length ? sl.reduce((a, b) => a + num(b.sleep), 0) / sl.length : null };

}
function blockReport(block){
  const r = blockRange(block); const d = today(); const to = r.to < d ? r.to : d;
  const finished = r.to < d;
  const weeks = Math.max(1, Math.min(6, Math.floor(daysBetween(r.from, to) / 7) + 1));
  const done = workouts().filter(w => w.status === 'terminée' && w.date >= r.from && w.date <= to);
  const perWeek = DAY_ORDER.filter(x => planDay(x).s).length;
  const planned = perWeek * weeks;
  const ids = new Set(); done.forEach(w => Object.keys(w.ex || {}).forEach(k => ids.add(canon(k))));
  const forces = [];
  ids.forEach(id => {
    const e = exDef(id); if (!e || (e.kind !== 'load' && e.kind !== 'bw')) return;
    const h = history(id, null).filter(x => !x.deload && x.date >= r.from && x.date <= to).reverse();
    if (h.length < 2) return;

  const bd = bodyDocs().filter(b => b.date >= r.from && b.date <= to); const wts = bd.filter(b => num(b.weight) > 0);
  let wc = null;
  if (wts.length >= 2) { const a = num(wts[0].weight), b = num(wts[wts.length - 1].weight); const span = Math.max(1, daysBetween(wts[0].date, wts[wts.length - 1].date) / 7); wc = { from:a, to:b, kg:b - a, pctWeek: ((b / a - 1) * 100) / span }; }

    else tips.push(['good', 'Régularité : ' + done.length + ' séances sur ' + planned + ' prévues, c’est solide.']);
  }
  const stag = forces.filter(f => f.pct < 1 && f.n >= 3);

  const up = forces.filter(f => f.pct >= 1);
  if (up.length) tips.push(['good', 'Progrès sur ' + up.length + ' exercice' + (up.length > 1 ? 's' : '') + ', le meilleur : ' + up[0].name + ' (+' + fmtKg(Math.round(up[0].pct * 10) / 10) + ' %).']);
  const low = MUSCLES.filter(m => mp[m] >= 3 && avg[m] < mp[m] * 0.6);
  if (low.length) tips.push(['warn', 'Volume nettement sous le prévu pour : ' + low.join(', ') + '. Ce sont souvent les exercices coupés en fin de séance ; place-les plus tôt ou raccourcis autre chose.']);

    else if (knee.length >= 5) tips.push(['good', 'Genou stable sous 3/10 tout le bloc : tu peux continuer à élargir l’amplitude au leg extension et garder les sauts.']);
  }
  if (wc) {
    const p = wc.pctWeek;
    tips.push(p < 0.1 ? ['info', 'Poids stable (' + (wc.kg >= 0 ? '+' : '') + fmtKg(Math.round(wc.kg * 10) / 10) + ' kg). Pour prendre du muscle, la cible courante est une hausse de 0,25 à 0,5 % du poids par semaine (Iraki et al., 2019).']
      : p > 0.6 ? ['warn', 'Hausse rapide (' + fmtKg(Math.round(p * 100) / 100) + ' % par semaine) : au-dessus de 0,5 %, une plus grande part risque d’être du gras.']
      : ['good', 'Poids en hausse de ' + fmtKg(Math.round(p * 100) / 100) + ' % par semaine : dans la cible de 0,25 à 0,5 % pour prendre du muscle.']);

}

  for (let v = Math.ceil(y0 / step) * step; v <= y1 + 1e-9; v += step) {
    const y = Y(v).toFixed(1);
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--line)" stroke-width="1"/>';
    g += '<text x="' + (L - 6) + '" y="' + (+y + 4) + '" text-anchor="end">' + fmtKg(Math.round(v * 10) / 10) + '</text>';
  }
  if (o.thresh != null) { const y = Y(o.thresh).toFixed(1);
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--bad)" stroke-width="1.5" stroke-dasharray="4 4"/>';
    g += '<text x="' + (W - R) + '" y="' + (+y - 5) + '" text-anchor="end" style="fill:var(--bad)">' + esc(o.threshLabel || '') + '</text>'; }
  g += '<text x="' + L + '" y="' + (H - 6) + '">' + esc(fmtDate(iso(new Date(x0)))) + '</text>';
  g += '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(fmtDate(iso(new Date(x1)))) + '</text>';
  series.forEach((s, si) => {
    const pts = s.pts.slice().sort((a, b) => a.x - b.x); if (!pts.length) return;
    const c = s.color || 'var(--accent)';
    if (s.line !== false && pts.length > 1) {
      const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
      if (si === 0 && o.area !== false) g += '<path d="' + d + ' L' + X(pts[pts.length - 1].x).toFixed(1) + ' ' + (H - B) + ' L' + X(pts[0].x).toFixed(1) + ' ' + (H - B) + ' Z" style="fill:' + c + '" fill-opacity="0.12"/>';
      g += '<path d="' + d + '" fill="none" style="stroke:' + c + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    pts.forEach((p, i) => { g += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (i === pts.length - 1 ? 4.5 : 2.8) + '" style="fill:' + c + '"/>'; });
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Graphique') + '">' + g + '</svg>';
}

function exCard(it, w, idx){

      }
    });
    h += '</div><div class="row between"><button type="button" class="link" data-act="addset" data-ex="' + esc(key) + '">+ Ajouter une série</button>' + (st.sets.length > 1 ? '<button type="button" class="link" data-act="rmset" data-ex="' + esc(key) + '">Retirer la dernière</button>' : '') + '</div>';
    if (it.kind !== 'plyo') h += '<div class="stack" style="gap:6px"><span class="label">Reps en réserve sur la dernière série</span><div class="chips">' + [0,1,2,3,4].map(v => '<button type="button" class="chip' + (st.rir === v ? ' on' : '') + '" data-act="rir" data-ex="' + esc(key) + '" data-v="' + v + '" aria-pressed="' + (st.rir === v) + '">' + (v === 4 ? '4+' : v) + '</button>').join('') + '</div></div>';
  }
  if (e.cue && it.kind !== 'check') h += '<details class="cue"><summary>Consignes</summary><p>' + esc(e.cue) + '</p></details>';
  return h + '</section>';
}

/* ---------- Choix d'un exercice ---------- */
function pickerList(){
  const P = S.picker; const q = (P.q || '').trim().toLowerCase();
  let ref = null;
  if (P.mode === 'replace') { const w = activeWorkout(); const it = w && itemsOf(w)[P.idx]; ref = it ? (exDef(it.ex) || it) : null; }
  const exclude = new Set();
  if (P.mode === 'replace' || P.mode === 'add') { const w = activeWorkout(); if (w) Object.keys(w.ex).forEach(k => exclude.add(canon(k))); }
  let list = allEx().filter(e => !exclude.has(e.id) && (!q || e.name.toLowerCase().indexOf(q) >= 0 || (e.muscles.p || []).join(' ').toLowerCase().indexOf(q) >= 0));
  const score = e => { if (!ref || !ref.muscles) return 0; let s = 0; (ref.muscles.p || []).forEach(x => { if ((e.muscles.p || []).indexOf(x) >= 0) s += 3; else if ((e.muscles.s || []).indexOf(x) >= 0) s += 1; }); if (e.kind === ref.kind) s += 0.5; return s; };
  list = list.map(e => ({ e, s:score(e) })).sort((a, b) => b.s - a.s || a.e.name.localeCompare(b.e.name, 'fr'));
  const row = x => '<button type="button" class="pick" data-act="pick" data-v="' + esc(x.e.id) + '"><span class="stack" style="gap:2px"><span class="n">' + esc(x.e.name) + '</span><span class="m">' + esc(KINDS[x.e.kind] || '') + ((x.e.muscles.p || []).length ? ' · ' + x.e.muscles.p.join(', ') : '') + (x.e.custom ? ' · perso' : '') + '</span></span><span aria-hidden="true">›</span></button>';
  const same = list.filter(x => x.s >= 3); const rest = list.filter(x => x.s < 3);
  let h = '';
  if (ref && same.length) h += '<span class="label">Même muscle</span>' + same.map(row).join('') + '<span class="label">Autres exercices</span>';
  h += rest.map(row).join('');
  return h || '<p class="empty">Aucun exercice trouvé. Crée-le avec le bouton ci-dessus.</p>';
}
function viewPicker(){
  const P = S.picker; const w = activeWorkout();

  let sub = '';
  if (P.mode === 'replace' && w) { const it = itemsOf(w)[P.idx]; sub = it ? 'À la place de « ' + it.name + ' ». Les séries et la place dans le superset sont gardées.' : ''; }

function applyPick(exId){
  const P = S.picker; if (!P) return;
  const e = exDef(exId); if (!e) return;
  if (P.mode === 'draft') {
    if (S.draft && S.draft.kind === 'tpl') S.draft.data.items.push({ ex:e.id, sets:e.sets, lo:e.lo, hi:e.hi, rest:e.rest, ss:null });
    S.picker = null; render(); return;
  }
  const w = activeWorkout(); if (!w) { S.picker = null; render(); return; }
  if (w.ex[e.id]) { toast('Cet exercice est déjà dans la séance.'); return; }
  if (!w.items) w.items = itemsOf(w).slice();
  const wk = weekInfo(w.date);
  if (P.mode === 'add') {
    const it = snapItem(e, {}); w.items.push(it); initItem(w, it, wk);
    toast(e.name + ' ajouté.');
  } else {
    const old = w.items[P.idx]; if (!old) return;
    const it = snapItem(e, { sets: old.sets, ss: old.ss });
    w.items[P.idx] = it; delete w.ex[old.ex]; delete w.targets[old.ex]; initItem(w, it, wk);
    if (P.alsoTpl && w.tpl) {
      const t = tplDef(w.tpl);
      if (t) { const j = t.items.findIndex(x => canon(x.ex) === canon(old.ex)); if (j >= 0) { t.items[j] = { ex:e.id, sets:t.items[j].sets, lo:e.lo, hi:e.hi, rest:e.rest, ss:t.items[j].ss || null }; saveTpl(t); } }
    }
    toast(old.name + ' remplacé par ' + e.name + (P.alsoTpl ? ' (aussi dans la séance modèle).' : '.'));
  }
  put(w.id, w); S.picker = null; render();
}

/* ---------- Progrès ---------- */

    chart([{ pts: tests.map(t => ({ x: parseIso(t.date).getTime(), y: t.cm })) }], { label:'Détente verticale', empty:'Aucun test pour l’instant.' }) +

        if (num(s.reps) == null) s.reps = String(t.reps && t.reps[i] != null ? t.reps[i] : it.lo);
        if (it.kind === 'bw' && num(s.kg) == null) s.kg = '0';
        if (num(s.kg) == null) { toast('Indique la charge utilisée.'); if (kgIn) kgIn.focus(); return; }
        const nx = st.sets[i + 1]; if (nx && !nx.done && num(nx.kg) == null) nx.kg = s.kg;
      } else s.reps = it.lo;
      s.done = true;
      const nxt = supersetNext(w, key);
      if (nxt) toast('Enchaîne : ' + nxt.name);
      else if (it.kind !== 'plyo') startRest(it.rest || 90, it.name + (i + 1 < st.sets.length ? ' · série ' + (i + 2) + ' ensuite' : ' · terminé'));
      else startRest(60, 'Récupère avant la série suivante');
    } else s.done = false;
    put(w.id, w); render();
  },
  check(b){ const w = activeWorkout(); if (!w) return; const st = w.ex[b.dataset.ex]; st.done = !st.done; put(w.id, w); render(); },
  unskip(b){ const w = activeWorkout(); if (!w) return; const st = w.ex[b.dataset.ex]; st.skip = false; if (!st.sets.length) { const it = itemsOf(w).find(x => x.ex === b.dataset.ex); for (let i = 0; i < (it ? it.sets : 3); i++) st.sets.push({ kg:null, reps:null, done:false }); } put(w.id, w); render(); },
  addset(b){ const w = activeWorkout(); if (!w) return; const st = w.ex[b.dataset.ex]; const last = st.sets[st.sets.length - 1]; st.sets.push({ kg: last ? last.kg : null, reps:null, done:false }); put(w.id, w); render(); },
  rmset(b){ const w = activeWorkout(); if (!w) return; const st = w.ex[b.dataset.ex]; if (st.sets.length > 1) st.sets.pop(); put(w.id, w); render(); },
  rir(b){ const w = activeWorkout(); if (!w) return; const st = w.ex[b.dataset.ex]; const v = +b.dataset.v; st.rir = st.rir === v ? null : v; put(w.id, w); render(); },
  knee(b){ const w = activeWorkout(); if (!w) return; const v = +b.dataset.v; w.knee = w.knee === v ? null : v; put(w.id, w); render(); },
  stairs(b){ const d = today(); const id = 'k_' + d; const v = +b.dataset.v; const cur = S.docs.get(id); if (cur && cur.stairs === v) del(id); else put(id, { date:d, stairs:v }); render(); },
  sleepq(b){ const d = today(); const id = 'b_' + d; const cur = Object.assign({ date:d }, S.docs.get(id) || {}); const v = +b.dataset.v; cur.sleepQ = cur.sleepQ === v ? null : v; put(id, cur); render(); },
  busy(b){ const s = settings(); const wk = mondayOf(today()); const busy = Object.assign({}, s.busy); if (b.checked) busy[wk] = true; else delete busy[wk]; putSettings({ busy }); render(); },
  deload(b){ const s = settings(); const wk = mondayOf(today()); const dl = Object.assign({}, s.deload); if (b.checked) dl[wk] = true; else delete dl[wk]; putSettings({ deload: dl }); render(); },
  'rest-add'(){ if (S.restEnd) S.restEnd += 15000; updateRest(); },
  'rest-stop'(){ stopRest(); },
  hist(b){ S.openHist = S.openHist === b.dataset.v ? null : b.dataset.v; S.confirm = null; render(); },
  'ask-del-w'(b){ S.confirm = b.dataset.v; render(); },
  'cancel-confirm'(){ S.confirm = null; render(); },
  'del-w'(b){ del(b.dataset.v); S.confirm = null; S.openHist = null; render(); toast('Séance supprimée.'); },
  reopen(b){ const w = S.docs.get(b.dataset.v); if (!w || activeWorkout()) return; w.status = 'en_cours'; put(b.dataset.v, w); S.view = 'session'; render(); window.scrollTo(0, 0); toast('Séance rouverte : corrige puis termine-la.'); },
  'add-test'(){ const cm = num($('#test-cm').value); const date = $('#test-date').value || today(); if (cm == null || cm <= 0 || cm > 150) { toast('Indique une hauteur en cm, par exemple 52.'); return; } put('t_' + Date.now().toString(36), { date, cm }); render(); toast('Test ajouté.'); },
  'del-test'(b){ if (S.confirm === b.dataset.v) { del(b.dataset.v); S.confirm = null; } else S.confirm = b.dataset.v; render(); },
  // Choix d'exercice
  'pick-add'(){ S.picker = { mode:'add', q:'' }; render(); window.scrollTo(0, 0); },
  'pick-replace'(b){ S.picker = { mode:'replace', idx:+b.dataset.i, q:'', alsoTpl:false }; render(); window.scrollTo(0, 0); },
  'pick-draft'(){ S.picker = { mode:'draft', q:'' }; render(); window.scrollTo(0, 0); },
  'pick-cancel'(){ S.picker = null; render(); },
  'pick-tpl'(b){ if (S.picker) S.picker.alsoTpl = b.checked; },
  pick(b){ applyPick(b.dataset.v); window.scrollTo(0, 0); },
  'new-ex-from-pick'(){ const back = { picker:S.picker, prevDraft:S.draft }; S.picker = null; S.draft = { kind:'ex', isNew:true, id:null, data:blankEx(), after:back }; render(); window.scrollTo(0, 0); },
  // Séances modèles
  'new-tpl'(){ S.draft = { kind:'tpl', isNew:true, id:'s' + rid(), data:{ name:'', focus:'', cut:'', items:[] } }; render(); window.scrollTo(0, 0); },
  'edit-tpl'(b){ const t = tplDef(b.dataset.v); if (!t) return; S.draft = { kind:'tpl', isNew:false, id:t.id, data:{ name:t.name, focus:t.focus || '', cut:t.cut || '', items: clone(t.items) } }; render(); window.scrollTo(0, 0); },
  'it-up'(b){ const a = S.draft.data.items; const i = +b.dataset.i; if (i > 0) { const x = a[i]; a[i] = a[i - 1]; a[i - 1] = x; } render(); },
  'it-down'(b){ const a = S.draft.data.items; const i = +b.dataset.i; if (i < a.length - 1) { const x = a[i]; a[i] = a[i + 1]; a[i + 1] = x; } render(); },
  'it-rm'(b){ S.draft.data.items.splice(+b.dataset.i, 1); render(); },
  'save-tpl'(){
    const D = S.draft; const t = D.data;
    if (!t.name.trim()) { toast('Donne un nom à la séance.'); $('#d-name').focus(); return; }
    if (!t.items.length) { toast('Ajoute au moins un exercice.'); return; }
    saveTpl(Object.assign({ id:D.id }, t)); S.draft = null; S.confirm = null; S.view = 'program'; S.progTab = 'seances'; render(); toast('Séance enregistrée.');
  },
  'reset-tpl'(){ del('p_' + S.draft.id); S.draft = null; render(); toast('Version d’origine rétablie.'); },
  'del-tpl'(){ S.confirm = 'del-tpl'; render(); },
  'del-tpl-yes'(){ const id = S.draft.id; del('p_' + id); const p = Object.assign({}, planOf()); let ch = false; Object.keys(p).forEach(k => { if (p[k] && p[k].s === id) { p[k] = { label:'Repos' }; ch = true; } }); if (ch) putSettings({ plan:p }); S.draft = null; S.confirm = null; render(); toast('Séance supprimée.'); },
  'draft-cancel'(){ const after = S.draft && S.draft.after; S.draft = after ? after.prevDraft || null : null; S.confirm = null; if (after) S.picker = after.picker; render(); },
  // Exercices
  'new-ex'(){ S.draft = { kind:'ex', isNew:true, id:null, data:blankEx() }; render(); window.scrollTo(0, 0); },
  'edit-ex'(b){ const e = exDef(b.dataset.v); if (!e) return; const d = clone(e); delete d.id; delete d.custom; S.draft = { kind:'ex', isNew:false, id:e.id, data:d }; render(); window.scrollTo(0, 0); },
  'e-kind'(b){ S.draft.data.kind = b.dataset.v; if (b.dataset.v === 'plyo' && !S.draft.data.unit) S.draft.data.unit = 'sauts'; render(); },
  'e-cat'(b){ S.draft.data.cat = b.dataset.v; render(); },
  'e-mp'(b){ const m = S.draft.data.muscles; m.p = toggleIn(m.p, b.dataset.v); m.s = (m.s || []).filter(x => m.p.indexOf(x) < 0); render(); },
  'e-ms'(b){ const m = S.draft.data.muscles; m.s = toggleIn(m.s, b.dataset.v); m.p = (m.p || []).filter(x => m.s.indexOf(x) < 0); render(); },
  'e-flag'(b){ S.draft.data[b.dataset.v] = b.checked; },
  'save-ex'(){
    const D = S.draft; const e = D.data;
    if (!String(e.name || '').trim()) { toast('Donne un nom à l’exercice.'); $('#e-name').focus(); return; }
    const isSet = e.kind === 'load' || e.kind === 'bw';
    const lo = num(e.lo), hi = num(e.hi);
    if (isSet && (!(lo > 0) || !(hi >= lo))) { toast('Vérifie la fourchette de reps : le max doit être au moins égal au min.'); return; }
    if (isSet && !(e.muscles.p || []).length) { toast('Choisis au moins un muscle principal.'); return; }
    const out = { name:String(e.name).trim(), kind:e.kind, cat:e.cat || 'iso', sets:num(e.sets) || 3, lo:lo || 1, hi:hi || lo || 1, rest:num(e.rest) || 90, step:num(e.step) || 2.5, unit:e.unit || '', uni:!!e.uni, knee:!!e.knee, muscles:{ p:(e.muscles.p || []).slice(), s:(e.muscles.s || []).slice() }, cue:e.cue || '' };
    if (e.optional) out.optional = true;
    const id = D.id || ('c' + rid());
    put('x_' + id, out);
    const after = D.after; S.draft = after ? after.prevDraft || null : null; S.confirm = null;
    toast('Exercice enregistré.');
    if (after) { S.picker = after.picker; applyPick(id); return; }
    render();
  },
  'reset-ex'(){ del('x_' + S.draft.id); S.draft = null; render(); toast('Version d’origine rétablie.'); },
  'del-ex'(){ S.confirm = 'del-ex'; render(); },
  'del-ex-yes'(){ del('x_' + S.draft.id); S.draft = null; S.confirm = null; render(); toast('Exercice supprimé.'); },
  'reset-plan'(){ const s = Object.assign({}, settings()); delete s.plan; put('settings', Object.assign(s, { start: startDate() })); render(); toast('Planning d’origine rétabli.'); },
  // Données
  async export(b){
    const kind = b.dataset.v;
    const data = kind === 'json' ? JSON.stringify({ app:'carnet-muscu', version:2, exportedAt:new Date().toISOString(), docs:Object.fromEntries(S.docs) }, null, 2) : toCsv();
    const filename = 'carnet-muscu-' + today() + (kind === 'json' ? '.json' : '.csv');
    if (downloadsCap) { try { await downloadsCap.save({ filename, data }); toast('Fichier prêt.'); return; } catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return; } }
    S.exportText = data; S.exportName = filename; render();
  },
  'copy-export'(){ const ta = $('#export-text'); const txt = S.exportText || ''; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Copié.'), () => { ta.select(); toast('Sélectionné : copie avec ton clavier.'); }); else ta.select(); },
  'import-local'(){ let n = 0; S.localBackup.forEach((o, id) => { if (!S.docs.has(id)) { put(id, o); n++; } }); S.localBackup = null; render(); toast(n + ' éléments récupérés.'); }
};
function toCsv(){
  const rows = [['date','seance','exercice','serie','kg','reps','reserve']];
  workouts().forEach(w => { itemsOf(w).forEach(it => { const st = w.ex && w.ex[it.ex]; if (!st || it.kind === 'check') return; validSets(st.sets).forEach((x, i) => rows.push([w.date, wName(w), it.name, i + 1, it.kind === 'plyo' ? '' : String(num(x.kg) || 0), x.reps, st.rir == null ? '' : st.rir])); }); });
  return rows.map(r => r.map(v => { const s = String(v); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.tagName === 'INPUT') return; // cases à cocher : gérées par change
  const fn = A[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-f]')) { setField(t); return; }
  if (t.matches('[data-pq]') && S.picker) { S.picker.q = t.value; const l = $('#pick-list'); if (l) l.innerHTML = pickerList(); return; }
  if (t.matches('[data-d]') && S.draft) { S.draft.data[t.dataset.d] = t.value; return; }
  if (t.matches('[data-it]') && S.draft) { const it = S.draft.data.items[+t.dataset.it]; if (it) it[t.dataset.k] = t.dataset.k === 'ss' ? (t.value || null) : t.value; return; }
  if (t.matches('[data-e]') && S.draft) { S.draft.data[t.dataset.e] = t.value; return; }
  if (t.matches('[data-b]')) {
    const d = today(); const id = 'b_' + d; const f = t.dataset.b;
    clearTimeout(bodyTimers[f]);
    bodyTimers[f] = setTimeout(() => { const cur = Object.assign({ date:d }, S.docs.get(id) || {}); const v = num(t.value); if (v == null) delete cur[f]; else cur[f] = v; put(id, cur); }, 600);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[type=checkbox][data-act]')) { const fn = A[t.dataset.act]; if (fn) fn(t); return; }
  if (t.matches('select[data-it]') && S.draft) { const it = S.draft.data.items[+t.dataset.it]; if (it) it.ss = t.value || null; return; }
  if (t.matches('[data-plan]')) { const p = Object.assign({}, planOf()); const v = t.value; p[t.dataset.plan] = v.indexOf('s:') === 0 ? { s:v.slice(2) } : { label:v.slice(2) }; putSettings({ plan:p }); toast('Planning mis à jour.'); return; }
  if (t.id === 'prog-ex') { S.progEx = t.value; render(); return; }
  if (t.id === 'set-height') { putSettings({ height: num(t.value) }); toast('Taille enregistrée.'); return; }
  if (t.id === 'start-date' && t.value) { const st = mondayOf(t.value); putSettings({ start: st }); render(); toast('Début fixé au lundi ' + fmtDate(st) + '.'); return; }
  if (t.id === 'import-file' && t.files && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result); const docs = j && j.docs; if (!docs || typeof docs !== 'object') throw new Error('format');
        let n = 0; Object.keys(docs).forEach(id => { if (/^(w_|k_|t_|b_|x_|p_)[A-Za-z0-9_\-.]+$/.test(id) || id === 'settings') { put(id, docs[id]); n++; } });
        toast(n + ' éléments importés.'); render();
      } catch (err) { toast('Fichier non reconnu : choisis un export JSON du carnet.'); }
    };
    r.readAsText(t.files[0]);
  }
});

init();
})();
</script>
